<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- 1. Meta Viewport สำหรับ Responsive Design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
 <title>รายการสินค้า OTOP & งานหัตถกรรม | ศูนย์รวมข้อมูล OTOP บุรีรัมย์</title>
  <meta name="description" content="ค้นหารายการสินค้า OTOP ผ้าซิ่นตีนแดง งานสาน เครื่องปั้นดินเผา แยกตามหมวดหมู่และอำเภอในจังหวัดบุรีรัมย์">

  <!-- Google Fonts: Sarabun (ใช้ฟอนต์เดียวทั้งเว็บ) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sarabun', 'sans-serif'], // กำหนดฟอนต์หลัก
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 2. ป้องกันการเลื่อนแนวนอน (No Horizontal Scroll) */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      font-family: 'Sarabun', sans-serif;
    }

    /* 3. รูปภาพปรับขนาดตามหน้าจออัตโนมัติ (Responsive Images) */
    img {
      max-width: 100%;
      height: auto;
    }

    /* 4. สถานะ Focus & Hover ชัดเจนสำหรับปุ่มและลิงก์ (Accessibility & UI/UX) */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #f59e0b !important; /* เส้นขอบสีส้มทองสว่างเมื่อกด Tab เลือก */
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-amber-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 flex flex-col min-h-screen transition-colors duration-300">

  <header class="bg-stone-800 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-amber-500"><i class="fa-solid fa-gem" aria-hidden="true"></i> OTOP บุรีรัมย์</a>
      <nav class="hidden md:flex items-center space-x-6">
        <a href="index.html" class="hover:text-amber-400 font-medium">หน้าแรก</a>
        <a href="listing.html" class="hover:text-amber-400 font-medium text-amber-400">สินค้าและหัตถกรรม</a>
        <a href="contact.html" class="hover:text-amber-400 font-medium">ติดต่อเรา</a>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-stone-700 transition" aria-label="สลับโหมดสว่าง/มืด"><i id="theme-icon" class="fas fa-moon"></i></button>
      </nav>
      <button id="mobile-menu-btn" class="md:hidden text-2xl text-amber-500" aria-label="เปิดเมนูมือถือ"><i class="fas fa-bars"></i></button>
    </div>
    <nav id="mobile-menu" class="hidden md:hidden bg-stone-900 border-t border-stone-700 px-4 pt-2 pb-4 space-y-2">
      <a href="index.html" class="block py-2 hover:text-amber-400 font-medium">หน้าแรก</a>
      <a href="listing.html" class="block py-2 text-amber-400 font-medium">สินค้าและหัตถกรรม</a>
      <a href="contact.html" class="block py-2 hover:text-amber-400 font-medium">ติดต่อเรา</a>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- H1 หนึ่งเดียวของหน้า -->
    <h1 class="text-2xl md:text-3xl font-bold mb-4 text-stone-800 dark:text-amber-400">รายการสินค้า OTOP และงานหัตถกรรม</h1>

    <!-- แสดงสภาพอากาศจาก Open-Meteo API -->
    <div id="weather-container" class="mb-6"></div>

    <!-- Search & Filter Controls -->
    <section class="bg-white dark:bg-stone-800 p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-4 justify-between items-center border border-stone-200 dark:border-stone-700">
      <div class="relative w-full md:w-1/2">
        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
        <input type="text" id="search-input" placeholder="ค้นหาชื่อสินค้า หรืออำเภอ..." class="w-full pl-10 pr-4 py-2 border rounded-lg dark:bg-stone-900 dark:border-stone-600 focus:outline-none focus:ring-2 focus:ring-amber-500" aria-label="ค้นหาชื่อสินค้า หรืออำเภอ">
      </div>
      <div class="w-full md:w-1/3">
        <select id="category-filter" class="w-full p-2 border rounded-lg dark:bg-stone-900 dark:border-stone-600 focus:outline-none focus:ring-2 focus:ring-amber-500" aria-label="เลือกหมวดหมู่สินค้า">
          <option value="all">ทุกหมวดหมู่</option>
          <option value="woven">ผ้าทอและเครื่องแต่งกาย</option>
          <option value="crafts">งานสานและของตกแต่ง</option>
          <option value="herbs">สมุนไพรและของใช้</option>
        </select>
      </div>
    </section>

    <!-- Products Grid -->
    <section id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- การ์ดสินค้าจะโหลดผ่าน JavaScript พร้อม alt tag -->
    </section>
  </main>

  <footer class="bg-stone-900 text-stone-400 py-6 border-t border-stone-800 text-center">
    <p>&copy; 2026 ศูนย์รวมข้อมูล OTOP และหัตถกรรมพื้นบ้านจังหวัดบุรีรัมย์</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/listing.js"></script>

  <!-- Modal แสดงรายละเอียดสินค้า OTOP -->
  <div id="product-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="bg-white dark:bg-stone-800 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl border border-stone-200 dark:border-stone-700 transform transition-all scale-95 opacity-0 duration-300 relative" id="modal-content">
      
      <!-- ปุ่มปิด Modal (X) -->
      <button id="close-modal" class="absolute top-4 right-4 bg-stone-100 dark:bg-stone-700 hover:bg-amber-600 hover:text-white text-stone-600 dark:text-stone-300 w-10 h-10 rounded-full flex items-center justify-center transition shadow z-10" aria-label="ปิด">
        <i class="fas fa-times text-lg"></i>
      </button>

      <div class="flex flex-col md:flex-row">
        <!-- รูปภาพสินค้าใน Modal -->
        <div class="md:w-1/2 h-64 md:h-auto relative bg-stone-100 dark:bg-stone-900">
          <img id="modal-image" src="" alt="" class="w-full h-full object-cover">
          <span id="modal-star" class="absolute top-4 left-4 bg-amber-500 text-stone-900 font-bold text-xs px-3 py-1 rounded-full shadow"></span>
        </div>

        <!-- รายละเอียดสินค้า -->
        <div class="md:w-1/2 p-6 flex flex-col justify-between">
          <div>
            <span id="modal-category" class="text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400"></span>
            <h3 id="modal-title" class="text-2xl font-bold text-stone-900 dark:text-stone-100 mt-1 mb-2"></h3>
            <p id="modal-district" class="text-sm text-stone-500 dark:text-stone-400 mb-4 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-amber-600"></i> <span id="modal-district-text"></span>
            </p>
            
            <div class="border-t border-b border-stone-100 dark:border-stone-700 py-3 my-3">
              <h4 class="text-xs font-bold text-stone-400 dark:text-stone-500 uppercase tracking-wider mb-1">ภูมิปัญญาท้องถิ่น & รายละเอียด</h4>
              <p id="modal-description" class="text-sm text-stone-600 dark:text-stone-300 leading-relaxed"></p>
            </div>

            <div class="space-y-1 text-xs text-stone-500 dark:text-stone-400">
              <p><i class="fa-solid fa-users text-amber-600 w-5"></i> <strong>กลุ่มวิสาหกิจ:</strong> <span id="modal-group"></span></p>
              <p><i class="fa-solid fa-phone text-amber-600 w-5"></i> <strong>ติดต่อสอบถาม:</strong> <span id="modal-phone"></span></p>
            </div>
          </div>

          <div class="mt-6 pt-4 border-t border-stone-100 dark:border-stone-700 flex justify-between items-center">
            <div>
              <span class="text-xs text-stone-400 block">ราคาโดยประมาณ</span>
              <span id="modal-price" class="text-2xl font-extrabold text-amber-700 dark:text-amber-400"></span>
            </div>
            <a id="modal-contact-btn" href="contact.html" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold text-sm px-4 py-2.5 rounded-lg transition shadow flex items-center gap-2">
              <i class="fa-solid fa-paper-plane"></i> สนใจสั่งซื้อ
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
